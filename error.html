<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IM Chat · 页面暂时无法打开</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6f5; color: #1c1e21; }
  .hero { background: linear-gradient(160deg, #07c160, #06a452); color: #fff; text-align: center; padding: 56px 20px 44px; }
  .hero .logo { width: 76px; height: 76px; border-radius: 20px; background: #fff; color: #07c160; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .hero h1 { font-size: 26px; letter-spacing: 1px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 40px; }
  .card { background: #fff; border-radius: 14px; padding: 22px 18px; text-align: center; }
  .card .ic { font-size: 40px; }
  .card h2 { font-size: 19px; margin: 12px 0 8px; }
  .card p { font-size: 14px; color: #6b7280; line-height: 1.7; }
  .btn { display: inline-block; margin-top: 18px; background: #07c160; color: #fff; font-size: 16px; font-weight: 700; padding: 12px 32px; border-radius: 999px; text-decoration: none; }
  .btn:active { transform: scale(.98); }
  footer { text-align: center; color: #9ca3af; font-size: 12.5px; padding: 8px 0 34px; }
</style>
</head>
<body>
  <div class="hero">
    <div class="logo">IM</div>
    <h1>IM Chat</h1>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="ic">🛠️</div>
      <h2>页面暂时无法打开</h2>
      <p>服务器正在休息或维护中，过一会儿再回来看看。<br>一般几分钟到两小时内会自动恢复，不用反复刷新。</p>
      <a class="btn" href="/">回到首页重试</a>
    </div>
  </div>
  <footer>IM Chat · 个人即时通讯工具</footer>
</body>
</html>
